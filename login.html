<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VIGILANT Smart Platform</title>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #0F172A 0%, #080D18 100%);
      padding: 20px;
    }

    .login-card-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .auth-tabs {
      display: flex;
      background: var(--bg-dark-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 28px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .auth-tab-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    .demo-credential-box {
      background: rgba(37, 99, 235, 0.08);
      border: 1px dashed rgba(37, 99, 235, 0.3);
      padding: 14px;
      border-radius: var(--radius-sm);
      margin-top: 20px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body data-page="login">

  <div class="login-card-container">
    <!-- Brand Header -->
    <div style="text-align:center; margin-bottom:28px;">
      <a href="index.html" class="brand-logo" style="justify-content:center; margin-bottom:12px;">
        <div class="brand-icon" style="width:44px; height:44px; font-size:1.4rem;"><i class="lucide-shield-check"></i></div>
        <span class="brand-name" style="font-size:1.6rem;">VIGILANT</span>
      </a>
      <p style="color:var(--text-muted); font-size:0.9rem;">Select your portal role to access the platform</p>
    </div>

    <!-- Role Switcher Tabs -->
    <div class="auth-tabs">
      <button id="tab-citizen" class="auth-tab-btn active">
        <i class="lucide-user"></i> Citizen Portal
      </button>
      <button id="tab-authority" class="auth-tab-btn">
        <i class="lucide-shield-alert"></i> Police / Authority
      </button>
    </div>

    <!-- Citizen Form -->
    <form id="citizen-login-form" onsubmit="handleAuth(event, 'citizen')">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="citizen-email" class="form-control" value="citizen@demo.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="citizen-password" class="form-control" value="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:10px;">
        Access Citizen Dashboard <i class="lucide-arrow-right"></i>
      </button>

      <div class="demo-credential-box">
        <strong style="color:var(--primary); display:block; margin-bottom:4px;">Demo Citizen Account:</strong>
        <code>Email: citizen@demo.com</code><br>
        <code>Password: demo123</code>
        <button type="button" class="btn btn-outline btn-sm" style="width:100%; margin-top:8px;" onclick="quickFill('citizen')">Auto-Fill Credentials</button>
      </div>
    </form>

    <!-- Authority Form (Initially Hidden) -->
    <form id="authority-login-form" onsubmit="handleAuth(event, 'authority')" style="display:none;">
      <div class="form-group">
        <label class="form-label">Official Email / Officer ID</label>
        <input type="email" id="authority-email" class="form-control" value="authority@demo.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Security Passcode</label>
        <input type="password" id="authority-password" class="form-control" value="••••••••" required>
      </div>

      <button type="submit" class="btn btn-danger btn-lg" style="width:100%; margin-top:10px;">
        Enter Command Center <i class="lucide-shield"></i>
      </button>

      <div class="demo-credential-box" style="background:rgba(239, 68, 68, 0.08); border-color:rgba(239, 68, 68, 0.3);">
        <strong style="color:var(--danger); display:block; margin-bottom:4px;">Demo Authority Officer Account:</strong>
        <code>Email: authority@demo.com</code><br>
        <code>Badge: POL-DEL-4092</code>
        <button type="button" class="btn btn-outline btn-sm" style="width:100%; margin-top:8px;" onclick="quickFill('authority')">Auto-Fill Credentials</button>
      </div>
    </form>

    <div style="text-align:center; margin-top:24px; font-size:0.88rem; display:flex; flex-direction:column; gap:8px;">
      <div>Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:700;">Register New Account</a></div>
      <div><a href="index.html" style="font-size:0.85rem; color:var(--text-muted);"><i class="lucide-arrow-left"></i> Return to Homepage</a></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function quickFill(role) {
      if (role === 'citizen') {
        document.getElementById('citizen-email').value = 'citizen@demo.com';
        document.getElementById('citizen-password').value = 'demo123';
      } else {
        document.getElementById('authority-email').value = 'authority@demo.com';
        document.getElementById('authority-password').value = 'demo123';
      }
      showToast(`Auto-filled ${role} credentials!`, 'success');
    }

    function handleAuth(event, role) {
      event.preventDefault();
      const email = role === 'citizen' ? document.getElementById('citizen-email').value : document.getElementById('authority-email').value;
      const pass = role === 'citizen' ? document.getElementById('citizen-password').value : document.getElementById('authority-password').value;

      showToast(`Authenticating ${role}...`, 'info');
      setTimeout(() => {
        window.AuthEngine.login(email, pass, role);
        if (role === 'authority') {
          window.location.href = 'authority/dashboard.html';
        } else {
          window.location.href = 'citizen/dashboard.html';
        }
      }, 600);
    }
  </script>
</body>
</html>

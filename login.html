<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VIGILANT Smart Platform</title>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #0F172A 0%, #080D18 100%);
      padding: 20px;
    }

    .login-card-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .auth-tabs {
      display: flex;
      background: var(--bg-dark-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 28px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .auth-tab-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

  </style>
</head>
<body data-page="login">

  <div class="login-card-container">
    <!-- Brand Header -->
    <div style="text-align:center; margin-bottom:28px;">
      <a href="index.html" class="brand-logo" style="justify-content:center; margin-bottom:12px;">
        <div class="brand-icon" style="width:44px; height:44px; font-size:1.4rem;"><i class="lucide-shield-check"></i></div>
        <span class="brand-name" style="font-size:1.6rem;">VIGILANT</span>
      </a>
      <p style="color:var(--text-muted); font-size:0.9rem;">Select your portal role to access the platform</p>
    </div>

    <!-- Role Switcher Tabs -->
    <div class="auth-tabs">
      <button id="tab-citizen" class="auth-tab-btn active" type="button" onclick="switchAuthTab('citizen')">
        <i class="lucide-user"></i> Citizen Portal
      </button>
      <button id="tab-authority" class="auth-tab-btn" type="button" onclick="switchAuthTab('authority')">
        <i class="lucide-shield-alert"></i> Police / Authority
      </button>
    </div>

    <!-- Citizen Form -->
    <form id="citizen-login-form" onsubmit="handleAuth(event, 'citizen')">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="citizen-email" class="form-control" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="citizen-password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:10px;">
        Access Citizen Dashboard <i class="lucide-arrow-right"></i>
      </button>

    </form>

    <!-- Authority Form (Initially Hidden) -->
    <form id="authority-login-form" onsubmit="handleAuth(event, 'authority')" style="display:none;">
      <div class="form-group">
        <label class="form-label">Official Email / Officer ID</label>
        <input type="email" id="authority-email" class="form-control" required>
      </div>

      <div class="form-group">
        <label class="form-label">Security Passcode</label>
        <input type="password" id="authority-password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-danger btn-lg" style="width:100%; margin-top:10px;">
        Enter Command Center <i class="lucide-shield"></i>
      </button>

    </form>

    <div style="text-align:center; margin-top:24px; font-size:0.88rem; display:flex; flex-direction:column; gap:8px;">
      <div>Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:700;">Register New Account</a></div>
      <div><a href="index.html" style="font-size:0.85rem; color:var(--text-muted);"><i class="lucide-arrow-left"></i> Return to Homepage</a></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    function switchAuthTab(role) {
      const citizenForm = document.getElementById("citizen-login-form");
      const authorityForm = document.getElementById("authority-login-form");
      const citizenTab = document.getElementById("tab-citizen");
      const authorityTab = document.getElementById("tab-authority");

      if (role === "citizen") {
        citizenForm.style.display = "block";
        authorityForm.style.display = "none";
        citizenTab.classList.add("active");
        authorityTab.classList.remove("active");
      } else {
        citizenForm.style.display = "none";
        authorityForm.style.display = "block";
        citizenTab.classList.remove("active");
        authorityTab.classList.add("active");
      }
    }

    async function handleAuth(event, role) {
      event.preventDefault();
      const email = role === "citizen" ? document.getElementById("citizen-email").value.trim() : document.getElementById("authority-email").value.trim();
      const password = role === "citizen" ? document.getElementById("citizen-password").value : document.getElementById("authority-password").value;

      if (typeof showToast === "function") showToast(`Authenticating ${role}...`, "info");

      try {
        const user = await window.AuthEngine.login(email, password, role);

        if (typeof showToast === "function") showToast("Login successful! Redirecting...", "success");

        const targetUrl = (user && user.role === "authority") ? "authority/dashboard.html" : "citizen/dashboard.html";
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 200);
      } catch (error) {
        console.error("Login error:", error);
        if (typeof showToast === "function") showToast(error.message || "Invalid credentials", "danger");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Center — VIGILANT</title>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="notifications-center">

  <div class="dashboard-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="brand-logo">
          <div class="brand-icon"><i class="lucide-shield-check"></i></div>
          <span class="brand-name">VIGILANT</span>
        </a>
      </div>

      <nav class="sidebar-menu">
        <div class="menu-category">Citizen Navigation</div>
        <a href="dashboard.html" class="nav-item">
          <i class="lucide-layout-dashboard"></i> Dashboard
        </a>
        <a href="my-vehicles.html" class="nav-item">
          <i class="lucide-car"></i> My Vehicles
        </a>
        <a href="challan-list.html" class="nav-item">
          <i class="lucide-file-text"></i> Challans
        </a>
        <a href="document-vault.html" class="nav-item">
          <i class="lucide-folder"></i> Documents
        </a>
        <a href="hypothecation-assistant.html" class="nav-item">
          <i class="lucide-banknote"></i> Hypothecation
        </a>
        <a href="stolen-report.html" class="nav-item">
          <i class="lucide-shield-alert"></i> Stolen Vehicle
        </a>
        <a href="notifications-center.html" class="nav-item active">
          <i class="lucide-bell"></i> Notifications <span class="badge-count">3</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-mini">
          <div class="avatar">SY</div>
          <div class="user-info">
            <span class="user-name">Sumit Yadav</span>
            <span class="user-role">Vehicle Owner</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">
      <header class="top-header">
        <button id="sidebar-toggle" class="btn-icon d-lg-none"><i class="lucide-menu"></i></button>

        <div style="font-size:0.9rem; color:var(--text-muted);">
          Notifications & Expiry Alerts
        </div>

        <div class="header-actions">
          <button class="role-switcher-btn" onclick="window.AuthEngine.switchRole('authority')">
            <i class="lucide-shield"></i> Authority View
          </button>
          <button class="btn btn-outline btn-sm" onclick="window.AuthEngine.logout()">Logout</button>
        </div>
      </header>

      <div class="dashboard-container" style="max-width:840px; margin:0 auto;">
        
        <div class="page-header">
          <div>
            <h1 class="page-title">Notifications & Reminders</h1>
            <p class="page-subtitle">Real-time alerts, document expiry reminders, and dispute review updates.</p>
          </div>

          <button class="btn btn-outline btn-sm" onclick="showToast('All notifications marked as read', 'success')">
            Mark All as Read
          </button>
        </div>

        <!-- Notifications Feed List -->
        <div id="notifications-list" style="display:flex; flex-direction:column; gap:14px;">
          <!-- Rendered by JS -->
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
